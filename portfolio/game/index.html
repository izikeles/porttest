<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Know Me: Volleyball Edition — a tiny game about Achilles</title>
  <meta name="description" content="Know Me: a tiny pixel RPG about Achilles. Walk his room, school, the court and the street, meet seven people and play a volleyball rally.">
  <meta name="theme-color" content="#8fd8ff">
  <meta property="og:title" content="Know Me: Volleyball Edition">
  <meta property="og:description" content="A tiny pixel RPG about Achilles. Meet seven people, then play a volleyball rally.">
  <meta property="og:image" content="../assets/projects/know-me-game.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="game.css">
</head>
<body>
<noscript><p style="margin:0;padding:12px;text-align:center;background:#ffd93b;color:#241a45;font:600 16px system-ui">This game needs JavaScript. <a href="../index.html">Back to the portfolio</a></p></noscript>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v6a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 15v4M8 20h8"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9c1.500 1.500 1.500 4.500 0 6M19 6c3 3 3 9 0 12"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 9 5 6M22 9l-5 6"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h7v16H4zM13 4h7v16h-7z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
</defs></svg>

<div class="shell">
  <header class="hud">
    <a class="pill back" href="../index.html" aria-label="Back to the portfolio"><svg class="ic"><use href="#i-home"/></svg><span class="lbl">Home</span></a>
    <p class="pill loc"><svg class="ic"><use href="#i-pin"/></svg><span id="loc">My Room</span></p>
    <button class="pill" id="dexbtn" type="button" aria-label="Open the people Dex"><svg class="ic"><use href="#i-book"/></svg>Dex <b id="met">0/7</b></button>
    <button class="pill sq" id="mute" type="button" aria-pressed="false" aria-label="Sound on. Turn off"><svg class="ic"><use href="#i-vol"/></svg></button>
  </header>

  <div class="col">
    <div class="stage" id="stage">
      <canvas id="cv" width="320" height="192" aria-label="Game view: a top-down pixel world with a volleyball court. Use the arrow keys or WASD to walk, E or Space to talk."></canvas>
      <div class="fade" id="fade"></div>
      <div class="dexov" id="dexov" hidden role="dialog" aria-label="People Dex">
        <header class="dexh"><h2>People Dex</h2><span>Best <b id="dexbest">0</b></span><button type="button" id="dexreset">Reset</button><button class="dexx" type="button" id="dexclose">Close</button></header>
        <ul id="dexlist"></ul>
      </div>
    </div>

    <section class="dialog" id="dialog">
      <p class="sr" id="sr" aria-live="polite"></p>
      <span class="who" id="who">Tip</span>
      <div class="dbody">
        <div class="face" id="faceBox" hidden><canvas id="face" width="64" height="64" aria-hidden="true"></canvas></div>
        <div class="txt"><p id="say"></p><div class="choices" id="choices"></div></div>
      </div>
      <i class="more" id="more" hidden aria-hidden="true"></i>
    </section>

    <div class="pad" id="pad" aria-label="On-screen controls">
      <div class="dpad">
        <button data-k="up" aria-label="Up"><svg class="ic"><use href="#i-up"/></svg></button>
        <button data-k="left" aria-label="Left"><svg class="ic"><use href="#i-left"/></svg></button>
        <button data-k="down" aria-label="Down"><svg class="ic"><use href="#i-down"/></svg></button>
        <button data-k="right" aria-label="Right"><svg class="ic"><use href="#i-right"/></svg></button>
      </div>
      <button class="abtn" id="act" type="button" aria-label="Talk or use">A</button>
    </div>
    <p class="help">Move: WASD or arrows · Talk: E, Space or Enter · Dex: click the Dex button</p>
  </div>
</div>
<script src="../sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
